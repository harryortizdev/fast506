<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperación de contraseña</title>
    </head>
    <body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, sans-serif;">

        <table border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
                <td align="center" style="padding: 20px 0;">

                    <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">

                        <tr>
                            <td align="center" bgcolor="#2C3E50" style="padding: 25px; color: #ffffff; font-size: 22px; font-weight: bold; letter-spacing: 1px;">
                                Fast506 - Recuperación de Contraseña
                            </td>
                        </tr>

                        <tr>
                            <td style="padding: 30px 20px; color: #333333; font-size: 16px; line-height: 1.6; text-align: center;">
                                <p style="margin-bottom: 10px;">Tu código de recuperación es:</p>
                                <p style="font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #2C3E50; margin: 20px 0;" th:text="${code}">000000</p>
                                <p style="color: #777777; font-size: 14px; margin-top: 20px;">Este código expira en 10 minutos.</p>
                                <p style="color: #777777; font-size: 13px; margin-top: 10px;">Si no solicitaste este código, podés ignorar este correo.</p>
                            </td>
                        </tr>

                        <tr>
                            <td bgcolor="#f8f9fa" style="padding: 20px; font-size: 12px; color: #777777; text-align: center; border-top: 1px solid #eeeeee;">
                                Fast506. Todos los derechos reservados.<br>
                                <span style="color: #999999;">Este es un correo automático generado por el sistema de gestión de la agencia.</span>
                            </td>
                        </tr>

                    </table>
                </td>
            </tr>
        </table>

    </body>
</html>
